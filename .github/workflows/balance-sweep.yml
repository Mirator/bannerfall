name: Balance sweep

# The 360-raid stance sweep in tests/e2e/stance-balance.spec.js. It costs minutes, so it
# runs here, beside Browser QA rather than inside it, and the PR gate returns without
# waiting on it — but IT CAN GO RED AND A RED SWEEP BLOCKS THE MERGE. It asserts a timeout
# budget (a policy that cannot finish its fights is not a measurement) and drift against the
# committed table in tests/e2e/__baselines__/orders-sweep.json.
#
# This description used to say the opposite — "not a regression guard: it carries
# `test.fail()` ... so it cannot go red on a code change" — describing an annotation Plan 033
# had already removed. PR #34 was merged over three red runs of this workflow. Do not
# reintroduce that sentence; see plans/044-the-sweep-tells-the-truth.md.
#
# A red run means one of two things: a policy started deadlocking (read `unresolved` in the
# printed table), or the balance moved past the drift tolerance. Neither is answered by
# re-recording the baseline unless the plan says why the new number is the correct one.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: balance-sweep-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      # Headless-shell only. `install chromium` fetches Chrome for Testing AND the headless
      # shell; every run here is headless, so it launches the shell and the full browser is
      # ~150 MB downloaded to sit unused. Baselines are unaffected — the shell is already the
      # binary that rendered every committed PNG. A run that ever needs a headed browser will
      # say so loudly ("Executable doesn't exist"), not drift.
      - name: Install Chromium headless shell
        run: npx playwright install --with-deps chromium-headless-shell
      - name: Run the balance sweep
        run: npm run test:balance
      - name: Upload Playwright report on failure
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: balance-sweep-report
          path: playwright-report/
          if-no-files-found: ignore
