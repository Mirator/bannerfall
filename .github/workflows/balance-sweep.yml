name: Balance sweep

# The 360-raid stance sweep in tests/e2e/stance-balance.spec.js is a recorded measurement,
# not a regression guard: it carries `test.fail()` because commanding does not currently
# beat not commanding, so it cannot go red on a code change — only report a different
# margin. It costs minutes, so it runs here, beside Browser QA rather than inside it, and
# the PR gate returns without waiting on it. Read its result when a change touches stance
# behaviour, squad orders or battle balance.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: balance-sweep-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run the balance sweep
        run: npm run test:balance
      - name: Upload Playwright report on failure
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: balance-sweep-report
          path: playwright-report/
          if-no-files-found: ignore
