name: Visual baselines

# One-shot helper for the documented baseline rule (tests/README.md): Canvas
# screenshots are byte-compared and system-ui rasterizes differently per OS, so
# baselines are only ever captured in CI's exact environment (ubuntu-latest,
# pinned Chromium). Run this when a change legitimately alters production
# visuals, download the artifact, and commit ONLY the intentionally changed or
# newly added PNGs — never a wholesale replacement of the directory.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      # Headless-shell only. `install chromium` fetches Chrome for Testing AND the headless
      # shell; every run here is headless, so it launches the shell and the full browser is
      # ~150 MB downloaded to sit unused. Baselines are unaffected — the shell is already the
      # binary that rendered every committed PNG. A run that ever needs a headed browser will
      # say so loudly ("Executable doesn't exist"), not drift.
      - name: Install Chromium headless shell
        run: npx playwright install --with-deps chromium-headless-shell
      - name: Capture visual baselines
        run: npx playwright test tests/e2e/visual-regression.spec.js --update-snapshots
      - name: Upload captured baselines
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: tests/e2e/__screenshots__/
