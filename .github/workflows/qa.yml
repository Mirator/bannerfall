name: Browser QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A second push to a branch makes the first run's verdict irrelevant. Cancel it rather
# than paying for both and waiting behind the stale one.
concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      # Headless-shell only. `install chromium` fetches Chrome for Testing AND the headless
      # shell; every run here is headless, so it launches the shell and the full browser is
      # ~150 MB downloaded to sit unused. Baselines are unaffected — the shell is already the
      # binary that rendered every committed PNG. A run that ever needs a headed browser will
      # say so loudly ("Executable doesn't exist"), not drift.
      - name: Install Chromium headless shell
        run: npx playwright install --with-deps chromium-headless-shell
      - name: Verify test configuration
        run: npm run test:tooling
      - name: Verify release cache tokens
        run: npm run test:release
      - name: Run browser QA
        run: npm test
      - name: Upload Playwright report on failure
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
