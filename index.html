<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bannerfall</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Relative on purpose: a project Pages site is served from a subpath, where the
     browser's implicit /favicon.ico request would miss the file entirely. -->
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<!-- Bundled on purpose. Every canvas string used to be drawn through `system-ui`,
     which resolves to a different family per host — Segoe UI here, DejaVu Sans on CI —
     and a different family moves every glyph far past the visual suite's differing-area
     cap. Inter (SIL OFL 1.1, see assets/fonts/OFL.txt), latin subset, variable 400-900. -->
<link rel="preload" href="assets/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face {
    font-family: 'Inter';
    font-style: normal;
    font-weight: 400 900;
    font-display: block;
    src: url('assets/fonts/inter-latin-var.woff2') format('woff2');
  }
  html, body { margin:0; padding:0; height:100%; background:#1E2A4A; overflow:hidden; }
  #game { display:block; width:100vw; height:100vh; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script type="module" src="src/main.js?v=r1c72333e9790"></script>
</body>
</html>
